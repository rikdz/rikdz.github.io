<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Cloud</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        
	#wordcloud-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 90vw;
            max-height: 90vh;
        }

        #wordcloud {
            border-radius: 10px;
            background: #fafafa;
            display: block;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 24px;
            padding: 40px;
        }
        
        .error {
            text-align: center;
            color: #c33;
            font-size: 18px;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div id="wordcloud-container">
        <div id="loading" class="loading">🔄 Loading word cloud...</div>
        <canvas id="wordcloud" width="900" height="500" style="display:none;"></canvas>
        <div id="error" class="error" style="display:none;"></div>
    </div>
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-analytics.js";
      import { getDatabase, ref, get} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

      // TODO: Add SDKs for Firebase products that you want to use
      // https://firebase.google.com/docs/web/setup#available-libraries

      // Your web app's Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyAk6AToTq7xAi09eKUN2uE4FQnO8-c1gUQ",
            authDomain: "edenword-2a8b0.firebaseapp.com",
            databaseURL: "https://edenword-2a8b0-default-rtdb.firebaseio.com",
            projectId: "edenword-2a8b0",
            storageBucket: "edenword-2a8b0.firebasestorage.app",
            messagingSenderId: "139615519633",
            appId: "1:139615519633:web:15c2170888dbeacba09030",
            measurementId: "G-4K6M56G0MD"
        };

        // Initialize Firebase

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        async function loadWordCloud() {
            /*
            try { */
                // Hide loading message
                document.getElementById('loading').style.display = 'none';
                
                // Reference to the text submissions in Realtime Database
                const textSubmissionsRef = ref(database, 'text_submissions');
                
                // Get all text submissions
                const snapshot = await get(textSubmissionsRef);
                const data = snapshot.val();
		console.log(data)
                
                if (!data) {
                    throw new Error('No data found in Firebase Realtime Database');
                }
                
                // Extract text from all submissions
                let allText = '';
                Object.values(data).forEach((submission) => {
                    // Assuming the text field is called 'text' - adjust as needed
                    if (submission.text) {
                        allText += ' ' + submission.text;
                    }
                });
                
                if (!allText.trim()) {
                    throw new Error('No text content found');
                }
                                // Define stop words to filter out
                const stopwordsRef= ref(database, 'stopwords');
		const stopsnapshot = await get(stopwordsRef);
                const stopWords = new Set(stopsnapshot.val());
                const badwordsRef= ref(database, 'badwords');
		const badsnapshot = await get(badwordsRef);
                const badWords = new Set(badsnapshot.val());
                // Process text into word frequency
                const wordFreq = {};
		const words = allText
                    .toLowerCase()
                    .replace(/[^\w\s]/g, ' ') // Replace punctuation with spaces
                    .split(/\s+/)
                    .filter(word =>
                        word.length > 3 && // Only words longer than 3 chars
                        !stopWords.has(word) && // Filter out stop words
                        !badWords.has(word) && // Filter out bad words
                        !/^\d+$/.test(word) // Filter out numbers
                    );
                
                words.forEach(word => {
                    wordFreq[word] = (wordFreq[word] || 0) + 1;
                });
                
                // Convert to WordCloud2 format
                const wordList = Object.entries(wordFreq)
                    .sort(([,a], [,b]) => b - a)
                    .slice(0, 100)
                    .map(([word, freq]) => [word, freq]);
                
                if (wordList.length === 0) {
                    throw new Error('No valid words found');
                }
                
                
                // Show and generate word cloud
                const canvas = document.getElementById('wordcloud');
                canvas.style.display = 'block';
                

		WordCloud(canvas, {
                    list: wordList,
                    gridSize: 4,
                    weightFactor: function(size) {
                        return Math.pow(size, 0.8) * 18;
                    },
                    fontFamily: 'Impact, Arial Black, sans-serif',
                    color: function(word, weight, fontSize, distance, theta) {
                        // Create dynamic colors based on word frequency and position
                        const colors = [
                            '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4',
                            '#feca57', '#ff9ff3', '#74b9ff', '#6c5ce7',
                            '#a29bfe', '#fd79a8', '#fdcb6e', '#e17055',
                            '#00b894', '#0984e3', '#b2bec3', '#dda0dd'
                        ];

                        // Use a combination of frequency and randomness for color selection
                        const frequencyIndex = Math.floor((weight / Math.max(...wordList.map(w => w[1]))) * colors.length * 0.7);
                        const randomIndex = Math.floor(Math.random() * colors.length * 0.3);
                        const colorIndex = (frequencyIndex + randomIndex) % colors.length;

                        return colors[colorIndex];
                    },
                    backgroundColor: 'transparent',
                    rotateRatio: 0.7,
                    rotationSteps: 8,
                    drawOutOfBound: false,
                    shrinkToFit: true,
                    minSize: 10,
                    maxRotation: Math.PI*0.3,
                    minRotation: -Math.PI*0.3,
                    shape: 'circle',
                    ellipticity: 0.8,
                    hover: function(item, dimension, event) {
                        // Add hover effects
                        if (item) {
                            canvas.style.cursor = 'pointer';
                        } else {
                            canvas.style.cursor = 'default';
                        }
                    },
		    click: function(item, dimension, event) {
                        // Add click animation effect
                        if (item) {
                            console.log('Clicked word:', item[0], 'frequency:', item[1]);
                            // Could add word highlighting or info display here
                        }
                    }
                });
            /*    
            } catch (error) {
                console.error('Error loading word cloud:', error);
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.style.display = 'block';
            }
            */
           setTimeout(loadWordCloud, 5000);
        }

        // Load word cloud when page loads
        window.addEventListener('load', loadWordCloud);
    </script>
</body>
</html>
